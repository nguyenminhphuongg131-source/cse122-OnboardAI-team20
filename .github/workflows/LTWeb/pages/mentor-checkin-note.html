<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sổ tay Check-in 1-on-1 | OnboardAI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="app-container">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>

      <main class="page-content">
        <!-- Header trang -->
        <div class="page-header">
          <div>
            <h1 class="page-title">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              Sổ tay Nhật ký Check-in 1-on-1
            </h1>
            <p class="page-subtitle">Ghi nhận buổi gặp gỡ định kỳ 2 tuần/lần, lắng nghe trở ngại và thống nhất hành động với nhân sự mới</p>
          </div>
          <div class="header-actions">
            <button class="btn btn-primary" onclick="openAddCheckinModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Ghi chép Check-in mới (C)
            </button>
          </div>
        </div>

        <!-- Bố cục 2 phần: Bộ lọc & Danh sách Check-in -->
        <div class="filter-bar">
          <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
            <label style="font-size: 0.85rem; font-weight: 600;">Lọc theo Nhân sự:</label>
            <select class="form-control" style="width: 240px; padding: 0.45rem 0.75rem;" id="mentee-selector-filter" onchange="renderCheckins()">
              <option value="all">Tất cả nhân sự mới</option>
              <!-- Sẽ nạp danh sách mentee từ JS -->
            </select>
          </div>
          <div style="font-size: 0.85rem; color: var(--text-muted);" id="checkin-total-count">
            Đang hiển thị 4 biên bản check-in
          </div>
        </div>

        <!-- Danh sách thẻ Check-in -->
        <div id="checkins-list-container" style="display: flex; flex-direction: column; gap: 1.25rem;">
          <!-- Sẽ kết xuất bằng JavaScript -->
        </div>

      </main>
    </div>
  </div>

  <!-- Modal Tạo mới / Chỉnh sửa Check-in (C/U) -->
  <div class="modal-overlay" id="checkin-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="checkin-modal-title">Ghi nhận Buổi Check-in 1-on-1</h3>
        <button class="modal-close-btn" onclick="UI.closeModal('checkin-modal')">✕</button>
      </div>
      <div class="modal-body">
        <form id="checkin-form">
          <input type="hidden" id="checkin-edit-id" />
          
          <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Chọn Nhân sự (Mentee)</label>
              <select class="form-control" id="form-mentee-id" required>
                <!-- Đổ danh sách newHires -->
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Ngày tổ chức</label>
              <input type="date" class="form-control" id="form-checkin-date" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Chủ đề chính của buổi gặp</label>
            <input type="text" class="form-control" id="form-checkin-summary" placeholder="Ví dụ: Rà soát tiến độ tuần 2, định hướng mục tiêu tháng đầu" required />
          </div>

          <div class="form-group">
            <label class="form-label">Đánh giá tinh thần & độ hòa nhập của Mentee</label>
            <select class="form-control" id="form-morale-rating">
              <option value="5">⭐⭐⭐⭐⭐ - 5/5: Rất tích cực, hòa nhập nhanh</option>
              <option value="4" selected>⭐⭐⭐⭐ - 4/5: Tốt, đáp ứng đúng kỳ vọng</option>
              <option value="3">⭐⭐⭐ - 3/5: Trung bình, cần thêm hướng dẫn</option>
              <option value="2">⭐⭐ - 2/5: Bị ngợp / gặp khó khăn cần hỗ trợ</option>
              <option value="1">⭐ - 1/5: Báo động nguy cơ không qua thử việc</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Khó khăn / Rào cản Mentee đang gặp phải</label>
            <textarea class="form-control" id="form-challenges" rows="2" placeholder="Ghi lại các rào cản kỹ thuật, công cụ, quyền truy cập hoặc giao tiếp..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Kế hoạch hành động thống nhất (Action Items)</label>
            <textarea class="form-control" id="form-action-items" rows="3" placeholder="1. Hoàn tất PR #408; 2. Senior cặp đôi hỗ trợ 1 buổi; 3. Báo cáo lại vào thứ 6..." required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Lịch hẹn Check-in lần tiếp theo</label>
            <input type="date" class="form-control" id="form-next-date" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="UI.closeModal('checkin-modal')">Hủy</button>
        <button class="btn btn-primary" onclick="submitCheckinForm()">Lưu biên bản</button>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      UI.initLayout("mentor-checkin-note.html", "Sổ tay Check-in 1-on-1");
      populateMenteeDropdowns();
      renderCheckins();
    });

    function populateMenteeDropdowns() {
      const mentees = StorageManager.getNewHires();
      const filterSelect = document.getElementById("mentee-selector-filter");
      const formSelect = document.getElementById("form-mentee-id");

      filterSelect.innerHTML = `<option value="all">Tất cả nhân sự mới</option>` + 
        mentees.map(m => `<option value="${m.id}">${m.name} (${m.role})</option>`).join("");

      formSelect.innerHTML = mentees.map(m => 
        `<option value="${m.id}">${m.name} - ${m.role} (${m.department})</option>`
      ).join("");
    }

    function renderCheckins() {
      const selectedMenteeId = document.getElementById("mentee-selector-filter").value;
      let checkins = StorageManager.getCheckins();

      if (selectedMenteeId !== "all") {
        checkins = checkins.filter(c => c.newHireId === selectedMenteeId);
      }

      document.getElementById("checkin-total-count").textContent = `Đang hiển thị ${checkins.length} biên bản check-in`;
      const container = document.getElementById("checkins-list-container");

      if (checkins.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📝</div>
            <div class="empty-title">Chưa có biên bản check-in nào</div>
            <p class="empty-desc">Hãy bắt đầu ghi chép buổi gặp gỡ đầu tiên để theo dõi sát sao sự tiến bộ của mentee.</p>
            <button class="btn btn-primary btn-sm" onclick="openAddCheckinModal()">+ Ghi chép ngay</button>
          </div>
        `;
        return;
      }

      container.innerHTML = checkins.map(c => {
        const starStr = "⭐".repeat(c.moraleRating) + "☆".repeat(5 - c.moraleRating);
        let moralePillClass = "badge-success";
        if (c.moraleRating <= 2) moralePillClass = "badge-danger";
        else if (c.moraleRating === 3) moralePillClass = "badge-warning";

        return `
          <div class="card" style="border-left: 4px solid var(--primary);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem;">
              <div>
                <div style="display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.35rem;">
                  <span style="font-size: 1.1rem; font-weight: 700; color: #1e293b;">${c.summary}</span>
                  <span class="badge ${moralePillClass}">${c.moraleRating}/5 ${starStr}</span>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">
                  Mentee: <strong style="color: var(--text-main);">${c.newHireName}</strong> • Người thực hiện: <strong>${c.mentorName}</strong> • Ngày: <strong>${c.date}</strong>
                </div>
              </div>
              <div style="display: flex; gap: 0.4rem;">
                <button class="btn btn-outline btn-sm" onclick="editCheckin('${c.id}')" title="Chỉnh sửa">
                  ✏️ Sửa
                </button>
                <button class="btn btn-outline btn-sm" style="color: #ef4444;" onclick="deleteCheckin('${c.id}')" title="Xóa">
                  ✕
                </button>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; background: #f8fafc; padding: 1rem; border-radius: var(--radius-md); font-size: 0.875rem;">
              <div>
                <strong style="color: #b91c1c; display: block; margin-bottom: 0.25rem;">🚧 Khó khăn / Thách thức ghi nhận:</strong>
                <p style="color: #475569; margin: 0;">${c.challenges || 'Không có khó khăn lớn phát sinh.'}</p>
              </div>
              <div>
                <strong style="color: #059669; display: block; margin-bottom: 0.25rem;">🎯 Kế hoạch hành động thống nhất:</strong>
                <p style="color: #1e293b; margin: 0; white-space: pre-line;">${c.actionItems}</p>
              </div>
            </div>

            ${c.nextDate ? `
              <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.75rem; text-align: right;">
                📅 Lịch check-in tiếp theo dự kiến: <strong style="color: var(--primary);">${c.nextDate}</strong>
              </div>
            ` : ''}
          </div>
        `;
      }).join("");
    }

    function openAddCheckinModal() {
      document.getElementById("checkin-modal-title").textContent = "Ghi nhận Buổi Check-in 1-on-1 Mới";
      document.getElementById("checkin-edit-id").value = "";
      document.getElementById("checkin-form").reset();

      // Mặc định ngày hôm nay và ngày kế tiếp sau 14 ngày
      const today = new Date().toISOString().split("T")[0];
      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + 14);

      document.getElementById("form-checkin-date").value = today;
      document.getElementById("form-next-date").value = nextDate.toISOString().split("T")[0];

      UI.openModal("checkin-modal");
    }

    function editCheckin(id) {
      const c = StorageManager.getCheckins().find(item => item.id === id);
      if (!c) return;

      document.getElementById("checkin-modal-title").textContent = "Chỉnh sửa Biên bản Check-in";
      document.getElementById("checkin-edit-id").value = c.id;
      document.getElementById("form-mentee-id").value = c.newHireId;
      document.getElementById("form-checkin-date").value = c.date;
      document.getElementById("form-checkin-summary").value = c.summary;
      document.getElementById("form-morale-rating").value = c.moraleRating;
      document.getElementById("form-challenges").value = c.challenges;
      document.getElementById("form-action-items").value = c.actionItems;
      document.getElementById("form-next-date").value = c.nextDate || "";

      UI.openModal("checkin-modal");
    }

    function submitCheckinForm() {
      const editId = document.getElementById("checkin-edit-id").value;
      const menteeId = document.getElementById("form-mentee-id").value;
      const date = document.getElementById("form-checkin-date").value;
      const summary = document.getElementById("form-checkin-summary").value.trim();
      const rating = parseInt(document.getElementById("form-morale-rating").value, 10);
      const challenges = document.getElementById("form-challenges").value.trim();
      const actionItems = document.getElementById("form-action-items").value.trim();
      const nextDate = document.getElementById("form-next-date").value;

      if (!summary || !actionItems) {
        UI.showToast("Thiếu thông tin", "Vui lòng nhập chủ đề và các kế hoạch hành động.", "warning");
        return;
      }

      const mentee = StorageManager.getNewHire(menteeId);
      const user = StorageManager.getCurrentUser();

      if (editId) {
        // Cập nhật (U)
        StorageManager.updateCheckin(editId, {
          newHireId: menteeId,
          newHireName: mentee.name,
          date,
          summary,
          moraleRating: rating,
          challenges,
          actionItems,
          nextDate
        });
        UI.showToast("Cập nhật thành công", "Đã lưu thay đổi cho biên bản check-in.", "success");
      } else {
        // Tạo mới (C)
        StorageManager.addCheckin({
          mentorId: user.id,
          mentorName: user.name,
          newHireId: menteeId,
          newHireName: mentee.name,
          department: mentee.department,
          date,
          summary,
          moraleRating: rating,
          challenges,
          actionItems,
          nextDate
        });
        UI.showToast("Đã lưu biên bản", `Đã ghi nhận buổi check-in với ${mentee.name}.`, "success");
      }

      UI.closeModal("checkin-modal");
      renderCheckins();
    }

    function deleteCheckin(id) {
      UI.showConfirm("Xóa biên bản", "Bạn có chắc chắn muốn xóa biên bản check-in này?", () => {
        StorageManager.deleteCheckin(id);
        UI.showToast("Đã xóa", "Biên bản check-in đã được gỡ bỏ.", "info");
        renderCheckins();
      });
    }
  </script>
</body>
</html>
