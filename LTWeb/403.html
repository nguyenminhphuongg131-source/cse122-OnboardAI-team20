<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Không có quyền truy cập | OnboardAI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div style="font-size: 5rem; font-weight: 900; color: #ef4444; line-height: 1; margin-bottom: 1rem;">
      403
    </div>
    <h1 style="font-size: 1.75rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">
      Không có quyền truy cập (Access Denied)
    </h1>
    <p style="font-size: 1rem; color: #64748b; max-width: 480px; margin-bottom: 2rem;">
      Tài khoản hiện tại của bạn không có đặc quyền để truy cập trang này. Hãy chuyển sang vai trò Quản trị viên hoặc HR để tiếp tục.
    </p>
    <div style="display: flex; gap: 0.75rem;">
      <a href="index.html" class="btn btn-outline">Về trang chủ</a>
      <a href="login.html" class="btn btn-primary">Đổi vai trò đăng nhập</a>
    </div>
  </div>
</body>
</html>
