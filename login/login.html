<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Hệ thống | OnboardAI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                  #f8fafc;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: var(--shadow-xl);
    }
    .quick-account-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: #fff;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
      width: 100%;
      margin-bottom: 0.5rem;
    }
    .quick-account-btn:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .quick-account-btn img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;">
        <div class="logo-icon" style="width: 32px; height: 32px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
        </div>
        <span style="font-weight: 800; font-size: 1.35rem; color: #0f172a;">Onboard<span style="color: var(--secondary);">AI</span></span>
      </a>
      <h1 style="font-size: 1.35rem; font-weight: 800; color: #0f172a;">Đăng nhập Cổng Thông tin</h1>
      <p style="font-size: 0.85rem; color: #64748b; margin-top: 0.25rem;">
        Hệ thống tích hợp 4 vai trò dành cho BTL-20 CSE122
      </p>
    </div>

    <!-- Nút đăng nhập nhanh 1 chạm cho 4 tài khoản thử nghiệm -->
    <div style="margin-bottom: 1.75rem;">
      <div style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 0.75rem; letter-spacing: 0.05em;">
        ⚡ Đăng nhập nhanh tài khoản mẫu:
      </div>

      <!-- New Hire -->
      <button class="quick-account-btn" onclick="quickLogin('nh-01')">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" alt="Newhire" />
        <div style="flex: 1;">
          <div style="font-weight: 700; font-size: 0.875rem;">Trần Minh Anh <span class="role-pill newhire">Nhân sự mới</span></div>
          <div style="font-size: 0.75rem; color: #64748b;">Frontend Developer • Ban IT</div>
        </div>
      </button>

      <!-- Mentor -->
      <button class="quick-account-btn" onclick="quickLogin('mt-01')">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" alt="Mentor" />
        <div style="flex: 1;">
          <div style="font-weight: 700; font-size: 0.875rem;">Lê Hoàng Long <span class="role-pill mentor">Mentor Lead</span></div>
          <div style="font-size: 0.75rem; color: #64748b;">Lead Architect • Cố vấn IT</div>
        </div>
      </button>

      <!-- HR -->
      <button class="quick-account-btn" onclick="quickLogin('hr-01')">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="HR" />
        <div style="flex: 1;">
          <div style="font-weight: 700; font-size: 0.875rem;">Nguyễn Thu Hà <span class="role-pill hr">HR People Ops</span></div>
          <div style="font-size: 0.75rem; color: #64748b;">Quản lý Onboarding & Lộ trình</div>
        </div>
      </button>

      <!-- Admin -->
      <button class="quick-account-btn" onclick="quickLogin('admin-01')">
        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150" alt="Admin" />
        <div style="flex: 1;">
          <div style="font-weight: 700; font-size: 0.875rem;">Bùi Quốc Cường <span class="role-pill admin">Quản trị viên</span></div>
          <div style="font-size: 0.75rem; color: #64748b;">Hệ thống & Cấu hình SLA</div>
        </div>
      </button>
    </div>

    <!-- Hoặc form đăng nhập thủ công -->
    <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
      <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
      <span style="font-size: 0.75rem; color: var(--text-muted);">HOẶC ĐĂNG NHẬP THỦ CÔNG</span>
      <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
    </div>

    <form onsubmit="handleManualLogin(event)">
      <div class="form-group">
        <label class="form-label">Email công việc</label>
        <input type="email" class="form-control" id="login-email" placeholder="ten@techcorp.vn" value="minhanh.tran@techcorp.vn" required />
      </div>
      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <input type="password" class="form-control" id="login-password" value="********" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">
        Đăng nhập vào Hệ thống
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
      <a href="index.html" style="color: var(--primary); font-weight: 600;">← Quay lại Trang giới thiệu</a>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script>
    function quickLogin(userId) {
      const user = StorageManager.setCurrentUser(userId);
      if (user) {
        UI.showToast("Đăng nhập thành công", `Chào mừng ${user.name} (${user.role.toUpperCase()})!`, "success");
        navigateByRole(user.role);
      }
    }

    function handleManualLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const users = StorageManager.getUsers();
      const matched = users.find(u => u.email.toLowerCase() === email);

      if (matched) {
        StorageManager.setCurrentUser(matched.id);
        UI.showToast("Đăng nhập thành công", `Chào mừng ${matched.name}!`, "success");
        navigateByRole(matched.role);
      } else {
        // Mặc định đăng nhập nhân sự mới
        quickLogin("nh-01");
      }
    }

    function navigateByRole(role) {
      const roleDefaultPages = {
        newhire: "pages/newhire-onboarding-dashboard.html",
        mentor: "pages/mentor-mentee-list.html",
        hr: "pages/hr-journey-management.html",
        admin: "pages/admin-department-management.html"
      };

      setTimeout(() => {
        window.location.href = roleDefaultPages[role] || "pages/newhire-onboarding-dashboard.html";
      }, 400);
    }
  </script>
</body>
</html>
