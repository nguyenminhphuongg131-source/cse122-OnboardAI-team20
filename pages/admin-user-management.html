<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Tài khoản & Phân quyền | OnboardAI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="app-container">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>

      <main class="page-content">
        <!-- Header trang -->
        <div class="page-header">
          <div>
            <h1 class="page-title">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              Quản trị Tài khoản & Phân quyền Người dùng
            </h1>
            <p class="page-subtitle">Quản lý định danh truy cập, phân công vai trò (Role-based Access Control) và gán cặp Mentor - Nhân sự mới</p>
          </div>
          <div class="header-actions">
            <button class="btn btn-primary" onclick="openAddUserModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Thêm tài khoản mới (C)
            </button>
          </div>
        </div>

        <!-- Bộ lọc theo vai trò & Tìm kiếm -->
        <div class="filter-bar">
          <div class="filter-pills" id="role-filters">
            <button class="filter-pill active" data-role="all" onclick="setUserRoleFilter('all')">Tất cả tài khoản</button>
            <button class="filter-pill" data-role="newhire" onclick="setUserRoleFilter('newhire')">Nhân sự mới</button>
            <button class="filter-pill" data-role="mentor" onclick="setUserRoleFilter('mentor')">Mentor / Quản lý</button>
            <button class="filter-pill" data-role="hr" onclick="setUserRoleFilter('hr')">HR Ops</button>
            <button class="filter-pill" data-role="admin" onclick="setUserRoleFilter('admin')">Quản trị viên</button>
          </div>

          <div style="flex: 1; max-width: 280px; min-width: 200px;">
            <input type="text" class="form-control" placeholder="Tìm theo tên, email, chức danh..." id="user-search-input" onkeyup="renderUsers()" />
          </div>
        </div>

        <!-- Bảng danh sách tài khoản (CRUD Table) -->
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Họ tên & Email</th>
                <th>Vai trò hệ thống</th>
                <th>Phòng ban</th>
                <th>Chức danh chuyên môn</th>
                <th>Trạng thái</th>
                <th style="text-align: right;">Thao tác quản trị</th>
              </tr>
            </thead>
            <tbody id="users-table-tbody">
              <!-- Sẽ render bằng JS -->
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- Modal Thêm / Chỉnh sửa Người dùng (C/U) -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="user-modal-title">Tạo Tài Khoản Mới</h3>
        <button class="modal-close-btn" onclick="UI.closeModal('user-modal')">✕</button>
      </div>
      <div class="modal-body">
        <form id="user-form">
          <input type="hidden" id="user-edit-id" />

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Họ và tên</label>
              <input type="text" class="form-control" id="form-user-name" placeholder="Nguyễn Văn B" required />
            </div>
            <div class="form-group">
              <label class="form-label">Email nội bộ</label>
              <input type="email" class="form-control" id="form-user-email" placeholder="vanb@techcorp.vn" required />
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Vai trò (Role)</label>
              <select class="form-control" id="form-user-role" onchange="handleRoleChangeInForm()">
                <option value="newhire">Nhân sự mới (New Hire)</option>
                <option value="mentor">Cố vấn / Quản lý (Mentor)</option>
                <option value="hr">Nhân sự (HR Specialist)</option>
                <option value="admin">Quản trị viên (Admin)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Phòng ban</label>
              <select class="form-control" id="form-user-dept">
                <option value="Công nghệ thông tin (IT)">Công nghệ thông tin (IT)</option>
                <option value="Tiếp thị & Truyền thông">Tiếp thị & Truyền thông</option>
                <option value="Kinh doanh & Bán hàng">Kinh doanh & Bán hàng</option>
                <option value="Nhân sự & Đào tạo">Nhân sự & Đào tạo</option>
                <option value="Tài chính & Kế toán">Tài chính & Kế toán</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Chức danh công việc</label>
            <input type="text" class="form-control" id="form-user-pos" placeholder="Ví dụ: Backend Developer, QA Engineer..." required />
          </div>

          <!-- Gán Mentor (chỉ hiện khi vai trò là newhire) -->
          <div class="form-group" id="mentor-assignment-group">
            <label class="form-label">Gán Cố vấn (Mentor) trực tiếp</label>
            <select class="form-control" id="form-user-mentor">
              <!-- Nạp danh sách mentors -->
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Trạng thái hoạt động</label>
            <select class="form-control" id="form-user-status">
              <option value="active">Hoạt động (Active)</option>
              <option value="inactive">Vô hiệu hóa (Inactive)</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="UI.closeModal('user-modal')">Hủy</button>
        <button class="btn btn-primary" onclick="submitUserForm()">Lưu tài khoản</button>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    let currentUserRoleFilter = "all";

    document.addEventListener("DOMContentLoaded", () => {
      UI.initLayout("admin-user-management.html", "Quản trị Tài khoản & Phân quyền");
      populateMentorsSelect();
      renderUsers();
    });

    function setUserRoleFilter(role) {
      currentUserRoleFilter = role;
      document.querySelectorAll("#role-filters .filter-pill").forEach(p => {
        p.classList.toggle("active", p.getAttribute("data-role") === role);
      });
      renderUsers();
    }

    function populateMentorsSelect() {
      const mentors = StorageManager.getUsers().filter(u => u.role === "mentor");
      const sel = document.getElementById("form-user-mentor");
      sel.innerHTML = mentors.map(m => `
        <option value="${m.id}">${m.name} - ${m.position} (${m.department})</option>
      `).join("");
    }

    function handleRoleChangeInForm() {
      const role = document.getElementById("form-user-role").value;
      const mentorGroup = document.getElementById("mentor-assignment-group");
      mentorGroup.style.display = role === "newhire" ? "block" : "none";
    }

    function renderUsers() {
      const search = document.getElementById("user-search-input").value.toLowerCase().trim();
      let users = StorageManager.getUsers();

      if (currentUserRoleFilter !== "all") {
        users = users.filter(u => u.role === currentUserRoleFilter);
      }

      if (search) {
        users = users.filter(u => 
          u.name.toLowerCase().includes(search) || 
          u.email.toLowerCase().includes(search) ||
          (u.position && u.position.toLowerCase().includes(search))
        );
      }

      const tbody = document.getElementById("users-table-tbody");

      if (users.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; padding: 2.5rem 1rem; color: #64748b;">
              <div style="font-size: 1.8rem; margin-bottom: 0.5rem;">👥</div>
              <div style="font-weight: 600;">Không tìm thấy tài khoản phù hợp</div>
            </td>
          </tr>
        `;
        return;
      }

      const roleLabels = {
        newhire: { label: "Nhân sự mới", class: "newhire" },
        mentor: { label: "Mentor", class: "mentor" },
        hr: { label: "HR Ops", class: "hr" },
        admin: { label: "Quản trị viên", class: "admin" }
      };

      tbody.innerHTML = users.map(u => {
        const rInfo = roleLabels[u.role] || { label: u.role, class: "newhire" };
        const statusBadge = u.status === "active"
          ? `<span class="badge badge-success">● Đang hoạt động</span>`
          : `<span class="badge badge-neutral">○ Tạm dừng</span>`;

        return `
          <tr>
            <td>
              <div class="user-cell">
                <img src="${u.avatar}" alt="${u.name}" />
                <div class="user-cell-meta">
                  <div class="name">${u.name}</div>
                  <div class="email">${u.email}</div>
                </div>
              </div>
            </td>
            <td>
              <span class="role-pill ${rInfo.class}">${rInfo.label}</span>
            </td>
            <td>
              <span style="font-size: 0.85rem;">${u.department || 'Chung'}</span>
            </td>
            <td>
              <span style="font-size: 0.85rem; font-weight: 500;">${u.position || u.role}</span>
            </td>
            <td>${statusBadge}</td>
            <td style="text-align: right;">
              <div style="display: flex; gap: 0.35rem; justify-content: flex-end;">
                <button class="btn btn-outline btn-sm" onclick="loginAsUser('${u.id}')" title="Đăng nhập thử vai trò này">
                  🔑 Đăng nhập
                </button>
                <button class="btn btn-outline btn-sm" onclick="editUserModal('${u.id}')" title="Sửa">
                  Sửa
                </button>
                <button
                    class="btn btn-outline btn-sm"
                    onclick="toggleUserStatus('${u.id}')"
                    title="${u.status === "inactive" ? "Mở khóa" : "Khóa"}">
                    ${u.status === "inactive" ? "Mở khóa" : "Khóa"}
                 </button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function loginAsUser(userId) {
      const user = StorageManager.setCurrentUser(userId);
      if (user) {
        UI.showToast("Chuyển tài khoản", `Đã chuyển sang: ${user.name} (${user.role.toUpperCase()})`, "success");
        setTimeout(() => {
          const roleDefaultPages = {
            newhire: "newhire-onboarding-dashboard.html",
            mentor: "mentor-mentee-list.html",
            hr: "hr-journey-management.html",
            admin: "admin-department-management.html"
          };
          window.location.href = roleDefaultPages[user.role] || "newhire-onboarding-dashboard.html";
        }, 400);
      }
    }

    function openAddUserModal() {
      document.getElementById("user-modal-title").textContent = "Tạo Tài Khoản Mới";
      document.getElementById("user-edit-id").value = "";
      document.getElementById("user-form").reset();
      handleRoleChangeInForm();
      UI.openModal("user-modal");
    }

    function editUserModal(userId) {
      const u = StorageManager.getUsers().find(item => item.id === userId);
      if (!u) return;

      document.getElementById("user-modal-title").textContent = "Chỉnh sửa Tài Khoản";
      document.getElementById("user-edit-id").value = u.id;
      document.getElementById("form-user-name").value = u.name;
      document.getElementById("form-user-email").value = u.email;
      document.getElementById("form-user-role").value = u.role;
      document.getElementById("form-user-dept").value = u.department || "Công nghệ thông tin (IT)";
      document.getElementById("form-user-pos").value = u.position || "";
      document.getElementById("form-user-status").value = u.status || "active";
      if (u.mentorId) {
        document.getElementById("form-user-mentor").value = u.mentorId;
      }
      handleRoleChangeInForm();

      UI.openModal("user-modal");
    }

    function submitUserForm() {
      const editId = document.getElementById("user-edit-id").value;
      const name = document.getElementById("form-user-name").value.trim();
      const email = document.getElementById("form-user-email").value.trim();
      const role = document.getElementById("form-user-role").value;
      const dept = document.getElementById("form-user-dept").value;
      const pos = document.getElementById("form-user-pos").value.trim();
      const status = document.getElementById("form-user-status").value;

      let mentorId = null;
      let mentorName = null;
      if (role === "newhire") {
        mentorId = document.getElementById("form-user-mentor").value;
        const mentorObj = StorageManager.getUsers().find(u => u.id === mentorId);
        if (mentorObj) mentorName = mentorObj.name;
      }

      if (!name || !email) {
        UI.showToast("Thiếu thông tin", "Vui lòng nhập họ tên và email.", "warning");
        return;
      }

      if (editId) {
        StorageManager.updateUser(editId, {
          name, email, role, department: dept, position: pos, status, mentorId, mentorName
        });
        UI.showToast("Cập nhật thành công", "Đã lưu thay đổi cho tài khoản.", "success");
      } else {
        StorageManager.addUser({
          name, email, role, department: dept, position: pos, status, mentorId, mentorName
        });
        UI.showToast("Tạo thành công", "Tài khoản mới đã được kích hoạt trong hệ thống.", "success");
      }

      UI.closeModal("user-modal");
      renderUsers();
    }
    function toggleUserStatus(userId) {
  const user = StorageManager.getUsers().find(u => u.id === userId);
  if (!user) return;

  const isActive = user.status !== "inactive";
  const nextStatus = isActive ? "inactive" : "active";
  const action = isActive ? "khóa" : "mở khóa";

  UI.showConfirm(
    isActive ? "Khóa tài khoản" : "Mở khóa tài khoản",
    `Bạn có chắc muốn ${action} tài khoản "${user.name}" không?`,
    () => {
      StorageManager.updateUser(userId, { status: nextStatus });
      UI.showToast(
        isActive ? "Đã khóa tài khoản" : "Đã mở khóa tài khoản",
        `Tài khoản "${user.name}" đã được ${action}.`,
        isActive ? "info" : "success"
      );
      renderUsers();
    }
  );
}

  </script>
</body>
</html>
